<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="proj1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764BA2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="250" fill="url(#proj1Bg)"/>
  
  <!-- Laptop -->
  <rect x="100" y="60" width="200" height="120" fill="#1E293B" rx="5"/>
  <rect x="110" y="70" width="180" height="100" fill="#0F172A"/>
  
  <!-- Screen Content -->
  <rect x="120" y="80" width="60" height="8" fill="#38BDF8" rx="2"/>
  <rect x="120" y="95" width="160" height="5" fill="#475569" rx="2"/>
  <rect x="120" y="105" width="140" height="5" fill="#475569" rx="2"/>
  <rect x="120" y="120" width="80" height="20" fill="#2563EB" rx="3"/>
  <text x="160" y="135" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Learn More</text>
  
  <!-- Laptop Base -->
  <path d="M80 180 L320 180 L340 200 L60 200 Z" fill="#334155"/>
  
  <!-- Floating Elements -->
  <circle cx="50" cy="40" r="15" fill="rgba(255,255,255,0.2)"/>
  <circle cx="350" cy="60" r="10" fill="rgba(255,255,255,0.15)"/>
  <circle cx="30" cy="150" r="8" fill="rgba(255,255,255,0.1)"/>
  
  <!-- Code Brackets -->
  <text x="40" y="100" font-family="monospace" font-size="40" fill="rgba(255,255,255,0.3)">&lt;/&gt;</text>
  <text x="320" y="180" font-family="monospace" font-size="30" fill="rgba(255,255,255,0.2)">{}</text>
</svg>
