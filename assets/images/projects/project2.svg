<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="proj2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F093FB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5576C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="250" fill="url(#proj2Bg)"/>
  
  <!-- Mobile Phone -->
  <rect x="150" y="30" width="100" height="180" fill="#1E293B" rx="15"/>
  <rect x="155" y="45" width="90" height="150" fill="#0F172A" rx="10"/>
  
  <!-- Phone Notch -->
  <rect x="175" y="32" width="50" height="8" fill="#1E293B" rx="4"/>
  
  <!-- App Content -->
  <rect x="165" y="55" width="70" height="30" fill="#2563EB" rx="5"/>
  <text x="200" y="75" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">App Title</text>
  
  <circle cx="180" cy="100" r="8" fill="#38BDF8"/>
  <rect x="195" y="95" width="40" height="5" fill="#475569" rx="2"/>
  <rect x="195" y="103" width="30" height="4" fill="#64748B" rx="2"/>
  
  <circle cx="180" cy="125" r="8" fill="#22C55E"/>
  <rect x="195" y="120" width="40" height="5" fill="#475569" rx="2"/>
  <rect x="195" y="128" width="35" height="4" fill="#64748B" rx="2"/>
  
  <circle cx="180" cy="150" r="8" fill="#EAB308"/>
  <rect x="195" y="145" width="35" height="5" fill="#475569" rx="2"/>
  <rect x="195" y="153" width="25" height="4" fill="#64748B" rx="2"/>
  
  <!-- Phone Button -->
  <circle cx="200" cy="205" r="5" fill="#334155"/>
  
  <!-- Floating Elements -->
  <circle cx="60" cy="50" r="20" fill="rgba(255,255,255,0.15)"/>
  <circle cx="340" cy="80" r="15" fill="rgba(255,255,255,0.1)"/>
  <circle cx="80" cy="200" r="12" fill="rgba(255,255,255,0.12)"/>
  
  <!-- Stars -->
  <text x="30" y="80" font-family="Arial" font-size="20" fill="rgba(255,255,255,0.3)">★</text>
  <text x="350" cy="150" font-family="Arial" font-size="16" fill="rgba(255,255,255,0.25)">★</text>
</svg>
